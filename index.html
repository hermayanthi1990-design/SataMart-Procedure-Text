<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SataMart Procedure Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a fixed 1280x720 game stage, scaled as one piece to fit any screen (letterboxed). */
:root{
  --red:#D3263A; --red-d:#A81B2C; --navy:#1D2A5B; --navy-2:#2E3F7F;
  --cream:#FBF3E4; --paper:#FFFDF8; --ink:#1A2140; --muted:#5B6280;
  --teal:#1E9C8E; --teal-l:#DDF4F0; --gold:#F2B21B; --warn:#B4461A; --warn-l:#FCE9DF;
  --line:#E6DCCB; --shadow:0 10px 30px rgba(29,42,91,.18);
  --f-display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
body{margin:0;background:#141A33;color:var(--ink);font-family:var(--f-body);overflow:hidden;}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:12px;
  background:radial-gradient(ellipse at center,#24305f 0%,#141A33 70%);}
:fullscreen #app,#app.fs{padding:0;}
#stageWrap{position:relative;flex:none;}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--cream);
  border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45);font-size:18px;line-height:1.45;}
.fsmode #stage{border-radius:0;}
#stage *{box-sizing:border-box;}
#stage img{max-width:100%;}
.t svg{width:22px;height:22px;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;color:var(--navy);}
p{margin:0;}
.scene{position:absolute;inset:0;}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.bg.soft::after{content:"";position:absolute;inset:0;background:rgba(251,243,228,.55);}
.bg.dim::after{content:"";position:absolute;inset:0;background:rgba(20,26,51,.25);}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:30;
  background:linear-gradient(180deg,rgba(29,42,91,.96),rgba(29,42,91,.9));color:#fff;}
.hud.clear{background:transparent;}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;white-space:nowrap;}
.brand .dot{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-size:17px;border:2px solid #fff;}
.loc{max-width:190px;overflow:hidden;text-overflow:ellipsis;font-size:13px;opacity:.85;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
.stats{display:flex;align-items:center;gap:6px;margin-left:auto;}
.stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.xpbar{width:80px;height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd866);border-radius:6px;transition:width .6s;}
.tools{display:flex;gap:5px;margin-left:6px;flex:none;}
.ib{width:38px;height:38px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .12s;padding:0;position:relative;}
.ib:hover{background:rgba(255,255,255,.25);transform:translateY(-1px);}
.ib svg{width:22px;height:22px;}
.ib.off::after{content:"";position:absolute;width:26px;height:3px;background:var(--red);transform:rotate(-45deg);border-radius:2px;box-shadow:0 0 0 1.5px #fff;}
.ib.assist{width:auto;padding:0 10px;gap:6px;display:flex;font-weight:800;font-size:14px;background:var(--gold);color:var(--navy);border-color:#fff;}
.ib[data-tip]:hover::before{content:attr(data-tip);position:absolute;top:46px;right:0;background:var(--ink);color:#fff;font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;}
.saved{position:absolute;left:14px;top:66px;z-index:30;font-size:13px;font-weight:700;background:rgba(255,253,248,.92);border-radius:999px;padding:3px 10px;color:var(--teal);border:1px solid var(--line);}
.saved.fail{color:var(--warn);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 22px;font-weight:800;cursor:pointer;
  font-size:18px;transition:transform .12s, box-shadow .12s, filter .12s;box-shadow:0 4px 0 rgba(0,0,0,.18);text-decoration:none;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none;}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d);}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 4px 0 #0f1838;}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 #136f65;}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:0 3px 0 rgba(29,42,91,.25);}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:10px;}
.btn.lg{padding:16px 34px;font-size:22px;border-radius:18px;font-family:var(--f-display);font-weight:600;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;gap:12px;}
.spacer{flex:1;}

/* Cover */
.cover-title{position:absolute;left:48px;top:92px;width:560px;}
.cover-title .eyebrow{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;}
.cover-title h1{font-size:48px;margin-top:14px;color:var(--navy);text-shadow:0 3px 0 #fff;}
.cover-title h1 em{font-style:normal;color:var(--red);}
.cover-title p{margin-top:12px;font-size:18px;font-weight:700;color:var(--ink);max-width:520px;background:rgba(255,253,248,.85);padding:8px 14px;border-radius:12px;}
.cover-btns{position:absolute;left:48px;top:470px;display:grid;grid-template-columns:auto auto;gap:14px;}
.cover-sata{position:absolute;right:300px;bottom:-30px;height:520px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));}

/* Mentor */
.mentor{position:absolute;left:8px;bottom:0;width:230px;z-index:5;pointer-events:none;}
.mentor img{width:230px;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2));}
.bubble{position:absolute;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:var(--shadow);z-index:6;}
.bubble::after{content:"";position:absolute;left:30px;bottom:-14px;border:12px solid transparent;border-top-color:var(--navy);border-bottom:0;}
.bubble .who{display:block;font-family:var(--f-display);color:var(--red);font-size:15px;}
.bubble .say{pointer-events:auto;}

/* Panel */
.panel{position:absolute;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);border:2px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 22px 10px;border-bottom:2px dashed var(--line);}
.panel-h h2{font-size:30px;}
.panel-h .tag{font-family:var(--f-display);background:var(--red);color:#fff;border-radius:10px;padding:2px 10px;font-size:18px;}
.panel-b{flex:1;overflow:auto;padding:16px 22px 20px;min-height:0;}
.panel-f{display:flex;gap:10px;align-items:center;padding:10px 22px;border-top:2px dashed var(--line);background:#fffaf0;}
.main-panel{left:250px;right:22px;top:74px;bottom:18px;}
.tabs{display:flex;gap:6px;padding:10px 22px 0;flex-wrap:wrap;}
.tab{border:2px solid var(--line);background:#fff;border-radius:12px 12px 0 0;padding:7px 14px;font-weight:800;cursor:pointer;font-size:15px;color:var(--muted);display:flex;gap:6px;align-items:center;}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab .st{font-size:13px;}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy);}
.card.navy h3{color:#fff;}
.card h3{font-size:21px;margin-bottom:6px;}
.lead{font-size:19px;font-weight:700;}
.small{font-size:15px;color:var(--muted);}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid2>*,.grid3>*{min-width:0;}
ol.steps{margin:6px 0 0;padding-left:24px;}
ol.steps li{margin:3px 0;}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;}
.pill.lock{background:#E8E5EE;color:#555;}
.pill.ready{background:var(--gold);color:var(--navy);}
.pill.prog{background:#D7E1FF;color:var(--navy);}
.pill.done{background:var(--teal);color:#fff;}
.listen{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px;cursor:pointer;vertical-align:middle;}
.listen:hover{background:var(--navy);color:#fff;}
.listen svg{width:16px;height:16px;}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-size:17px;}
textarea:focus,input[type=text]:focus{border-color:var(--navy);outline:none;}
textarea{resize:none;line-height:1.45;}
input.gap{width:150px;display:inline-block;padding:3px 8px;border-width:0 0 3px;border-radius:6px 6px 0 0;background:#FFF6DD;font-weight:800;text-align:center;}
.err{color:var(--warn);font-weight:800;font-size:14px;}

/* Options & feedback */
.opts{display:flex;flex-direction:column;gap:8px;}
.opts.h{flex-direction:row;flex-wrap:wrap;}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;transition:border-color .12s, transform .12s;}
.opt:hover{border-color:var(--navy);transform:translateX(2px);}
.opt .mk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--muted);}
.opt.ok{border-color:var(--teal);background:var(--teal-l);}
.opt.ok .mk{background:var(--teal);border-color:var(--teal);color:#fff;}
.opt.no{border-color:var(--warn);background:var(--warn-l);}
.opt.no .mk{background:var(--warn);border-color:var(--warn);color:#fff;}
.opt.sel{border-color:var(--navy);background:#EEF2FF;}
.opt.sel .mk{background:var(--navy);color:#fff;border-color:var(--navy);}
.opt.img{flex-direction:column;padding:8px;}
.opt.img img{width:100%;border-radius:10px;display:block;}
.fb{border-radius:14px;padding:10px 14px;font-weight:700;margin-top:10px;display:flex;gap:10px;align-items:flex-start;}
.fb .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;}
.fb.ok{background:var(--teal-l);border:2px solid var(--teal);}
.fb.ok .ic{background:var(--teal);}
.fb.no{background:var(--warn-l);border:2px solid var(--warn);}
.fb.no .ic{background:var(--warn);}
.fb.info{background:#EEF2FF;border:2px solid var(--navy-2);}
.fb.info .ic{background:var(--navy-2);}
.fb b{font-family:var(--f-display);font-weight:600;}

/* Chips & slots */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:14px;background:#FFFBF2;min-height:56px;}
.chip{border:2px solid var(--navy);background:#fff;border-radius:12px;padding:7px 14px;font-weight:800;cursor:grab;user-select:none;color:var(--navy);transition:transform .1s;}
.chip:hover{transform:translateY(-2px);}
.chip.sel{background:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(242,178,27,.6);}
.chip.used{opacity:.3;pointer-events:none;}
.slotrow{display:flex;align-items:center;gap:10px;margin:6px 0;}
.slot{min-width:190px;min-height:44px;border:2px dashed var(--navy-2);border-radius:12px;background:#F4F6FF;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;font-weight:800;cursor:pointer;color:var(--navy);}
.slot.empty{color:#97A0C3;font-weight:700;font-size:15px;}
.slot.hot{background:#FFF3C9;border-color:var(--gold);}
.slot.ok{border-style:solid;border-color:var(--teal);background:var(--teal-l);}
.slot.no{border-style:solid;border-color:var(--warn);background:var(--warn-l);}
.slot .g{font-weight:900;}
.num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;}

/* Map */
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border:0;background:none;padding:0;z-index:4;}
.spot .badge{font-family:var(--f-display);font-weight:700;font-size:20px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;border:4px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.3);transition:transform .15s;}
.spot:hover .badge{transform:scale(1.1);}
.spot .lbl{background:rgba(255,253,248,.96);border:2px solid var(--navy);border-radius:12px;padding:3px 10px;font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap;text-align:center;line-height:1.2;}
.spot.locked .badge{background:#8A8FA3;}
.spot.done .badge{background:var(--teal);}
.spot.ready .badge{animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,178,27,.9),0 6px 14px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 14px rgba(242,178,27,0),0 6px 14px rgba(0,0,0,.3)}}
.mapbar{position:absolute;left:16px;right:16px;bottom:14px;z-index:5;display:flex;align-items:center;gap:14px;background:rgba(255,253,248,.96);border:2px solid var(--navy);border-radius:16px;padding:10px 16px;font-size:15px;}

/* Modal */
.mback{position:absolute;inset:0;background:rgba(20,26,51,.55);z-index:50;display:grid;place-items:center;animation:fade .18s;}
.modal{width:900px;max-height:640px;background:var(--paper);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;border:3px solid var(--navy);animation:pop .22s;}
.modal.narrow{width:620px;}
.modal.wide{width:1080px;}
.modal-h{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--navy);color:#fff;}
.modal-h h2{color:#fff;font-size:26px;}
.modal-h .x{margin-left:auto;}
.modal-b{padding:16px 22px;overflow:auto;min-height:0;}
.modal-f{padding:12px 22px;border-top:2px dashed var(--line);display:flex;gap:10px;justify-content:flex-end;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:var(--shadow);animation:pop .2s;max-width:760px;text-align:center;}
.xpfloat{position:absolute;z-index:70;font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--gold);text-shadow:0 3px 0 var(--navy),0 0 20px rgba(0,0,0,.3);left:50%;top:45%;transform:translate(-50%,-50%);animation:rise 1.6s forwards;pointer-events:none;}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
.stampAnim{animation:stamp .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:65;}

/* Vocab table */
table.t{width:100%;border-collapse:collapse;font-size:16px;}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px;font-weight:800;position:sticky;top:0;}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.t tr:nth-child(even) td{background:#FFF8EC;}
.word{font-weight:800;color:var(--navy);}
.idn{color:var(--red-d);font-weight:700;}
.hl{background:#FFE9A8;border-radius:5px;padding:0 4px;cursor:pointer;border-bottom:3px solid var(--gold);font-weight:800;}
.hl.seen{background:#D8F1EC;border-bottom-color:var(--teal);}
.hl.goal{background:#FFD9DD;border-bottom-color:var(--red);}
.preview-phone{width:300px;border:10px solid var(--ink);border-radius:30px;background:#fff;overflow:hidden;box-shadow:var(--shadow);flex:none;}
.preview-phone .top{background:var(--red);color:#fff;font-family:var(--f-display);text-align:center;padding:6px;font-size:16px;}
.preview-phone .ph{height:200px;background:#EEE;display:grid;place-items:center;color:#999;font-size:14px;overflow:hidden;}
.preview-phone .ph img{width:100%;height:100%;object-fit:cover;}
.preview-phone .cap{padding:10px 12px;font-size:15px;min-height:110px;}
.preview-phone .cap .nm{font-family:var(--f-display);font-size:20px;color:var(--navy);}
.miss{color:#B0B5C9;font-style:italic;}
.icon-step{width:92px;height:92px;flex:none;}
.reader{font-size:19px;line-height:1.6;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 20px;white-space:pre-wrap;}
.timer{font-family:var(--f-display);font-size:24px;background:var(--red);color:#fff;border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums;}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.tog{width:58px;height:32px;border-radius:999px;background:#C8CCDA;border:0;position:relative;cursor:pointer;flex:none;}
.tog::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
.tog.on{background:var(--teal);}
.tog.on::after{left:30px;}
input[type=range]{accent-color:var(--navy);width:220px;}
.statusline{font-weight:800;color:var(--teal);}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head><body>
<div id="app">
  <div id="stageWrap">
    <div id="stage" role="application" aria-label="SataMart Procedure Quest game">
      <div id="scene" class="scene"></div>
      <div id="hud"></div>
      <div id="savedTag" class="saved" hidden></div>
      <div id="layer"></div>
    </div>
  </div>
</div>
<script>
/* ================= DATA ================= */
const IMG = n => 'assets/images/' + n;
const MENTOR = 'Ms. Sata';

const MISSIONS = [
  {id:'M0', name:'First Day at SataMart', tag:'Meet the team and see what you will learn', place:'Reception Desk', xp:20, x:21, y:30, phase:'Start'},
  {id:'M1', name:'Passport to Promotion', tag:'Read two model texts and collect 2 stamps', place:'Reading Corner', xp:60, x:40, y:30, phase:'Understand'},
  {id:'M2', name:'SOP Detective Lab', tag:'Find the structure, verbs, order and safety clues', place:'SOP Table', xp:80, x:60, y:30, phase:'Understand'},
  {id:'M3', name:'Content Creator Studio', tag:'Follow the SOP and post a promotion', place:'Photo Studio', xp:120, x:80, y:30, phase:'Create a promotion'},
  {id:'M4', name:'Rush Hour Challenge', tag:'Solve 3 quick cases before the store opens', place:'Challenge Table', xp:60, x:22, y:62, phase:'Create a promotion'},
  {id:'M5', name:'Boss Level: Guide Maker', tag:'Write a product guide for customers', place:'Demo Table', xp:130, x:50, y:62, phase:'Write a guide'},
  {id:'M6', name:'Test Drive & Level Up', tag:'Test, revise, quiz and reflect', place:'Review Desk', xp:130, x:78, y:62, phase:'Reflect'}
];
const LEVELS = [[0,'Marketing Trainee'],[100,'Content Assistant'],[300,'Campaign Navigator'],[600,'Quest Finisher']];

/* Vocabulary: [English, Indonesian, example] */
const VOCAB = {
  'procedure text':['teks prosedur','A procedure text tells you how to do something.'],
  'goal':['tujuan','The goal is to set up the phone stand.'],
  'tools':['alat','You need a camera and a laptop.'],
  'materials':['bahan','The materials are a product card and photos.'],
  'step':['langkah','Step 1: Choose a clear photo.'],
  'instruction':['petunjuk / instruksi','Read the instructions first.'],

let AC=null, musicGain=null, sfxGain=null, musicOn=false, musicTimer=null, nextNoteT=0, step16=0, duck=1;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
      musicGain = AC.createGain(); musicGain.connect(AC.destination);
      sfxGain = AC.createGain(); sfxGain.connect(AC.destination); applyVol(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function applyVol(){ if(!AC) return; musicGain.gain.setTargetAtTime((S.settings.music? S.settings.mv*0.5 : 0)*duck, AC.currentTime, .15); sfxGain.gain.value = S.settings.sfx? S.settings.sv : 0; }
function tone(f, t, d, type='sine', g=.25, dest){ const o=AC.createOscillator(), v=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.012); v.gain.exponentialRampToValueAtTime(.0008,t+d); o.connect(v); v.connect(dest||sfxGain); o.start(t); o.stop(t+d+.05); return o; }
function noise(t, d, g=.2, hp=2000, dest){ const len=Math.max(1,Math.floor(AC.sampleRate*d)); const b=AC.createBuffer(1,len,AC.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const v=AC.createGain(); v.gain.value=g; s.connect(f); f.connect(v); v.connect(dest||sfxGain); s.start(t); }
function sfx(name){
  if(!S.settings.sfx || !ac()) return; const t=AC.currentTime+.01;
  switch(name){
    case 'click': tone(1046,t,.07,'triangle',.18); tone(1568,t+.02,.05,'sine',.08); break;
    case 'tab': tone(784,t,.06,'triangle',.12); break;
    case 'pick': tone(660,t,.06,'triangle',.16); tone(990,t+.04,.06,'triangle',.12); break;
    case 'drop': tone(520,t,.08,'sine',.2); noise(t,.04,.06,3000); break;

/* Background music: cheerful shop loop, F – Dm – Bb – C, 96 BPM */
const CH = [[53,57,60,65],[50,57,62,65],[46,53,58,62],[48,55,60,64]];
const MEL = [72,null,69,72, 74,null,72,null, 69,null,67,65, 67,null,null,null, 74,null,72,74, 77,null,74,null, 72,null,70,69, 67,null,69,null];
const mtof = m => 440*Math.pow(2,(m-69)/12);
function schedMusic(){
  const spb = 60/96/4;
  while(nextNoteT < AC.currentTime + .15){
    const t=nextNoteT, s=step16%64, bar=Math.floor(s/16), ch=CH[bar], b=s%16;
    if(b===0){ ch.forEach(n=>{ const o=AC.createOscillator(), v=AC.createGain(), f=AC.createBiquadFilter(); o.type='triangle'; o.frequency.value=mtof(n); f.type='lowpass'; f.frequency.value=900; v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(.05,t+.3); v.gain.linearRampToValueAtTime(.03,t+spb*15); v.gain.linearRampToValueAtTime(0,t+spb*16); o.connect(f); f.connect(v); v.connect(musicGain); o.start(t); o.stop(t+spb*16+.05); }); }
    if(b===0||b===8||b===14) tone(mtof(ch[0]-12), t, spb*(b===14?1.6:5), 'sine', .2, musicGain);
    if(b%2===0){ const arp=ch[(b/2)%4]+12; tone(mtof(arp), t, .18, 'triangle', .045, musicGain); }
    if(b%4===2) noise(t,.04,.05,7000,musicGain);
    if(b===4||b===12) noise(t,.09,.06,1500,musicGain);
    const m = MEL[(s%32)]; if(m && s>=16 && s%2===0) tone(mtof(m), t, spb*1.8, 'sine', .06, musicGain);
    nextNoteT += spb; step16++;
  }
}
function startMusic(){ if(!S.settings.music || musicOn || !ac()) return; musicOn=true; nextNoteT=AC.currentTime+.1; step16=0; applyVol(); musicTimer=setInterval(schedMusic,40); }
function stopMusic(){ musicOn=false; clearInterval(musicTimer); }

/* Narration (browser text-to-speech, English) */
/* Ranks the device's English voices so the most natural (neural / premium / online) female voice is used for Ms. Sata. */
let voice=null, VOICES=[];
function voiceScore(v){
  const n=v.name, l=v.lang||''; let s=0;
  if(!/^en/i.test(l)) return -999;
  if(/natural|neural/i.test(n)) s+=60;
  if(/premium|enhanced|online/i.test(n)) s+=45;
  if(/google us english|google uk english female/i.test(n)) s+=40;
  if(/\b(ava|jenny|aria|michelle|emma|ana|sonia|libby|natasha|clara|zoe|allison|susan|samantha|serena|karen|moira|tessa|kate|stephanie|nicky)\b/i.test(n)) s+=25;
  if(/female|woman/i.test(n)) s+=15;
  if(/\b(david|mark|guy|daniel|alex|fred|tom|aaron|ryan|eric|christopher|male|andrew|brian|roger|steffan)\b/i.test(n)) s-=40;
  if(/compact|espeak|robot|novelty|bad news|bells|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|boing|wobble/i.test(n)) s-=80;
  if(/en[-_]US/i.test(l)) s+=10; else if(/en[-_](GB|AU|IE|CA)/i.test(l)) s+=6;
  if(v.localService===false) s+=8;
  return s;
}
function pickVoice(){ try{ VOICES = speechSynthesis.getVoices().filter(v=>voiceScore(v)>-500).sort((a,b)=>voiceScore(b)-voiceScore(a));
  voice = VOICES.find(v=>v.name===S.settings.voice) || VOICES[0] || null; }catch(e){} }
try{ speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); setTimeout(pickVoice,800); }catch(e){}
function speak(text, slow){
  if(!S.settings.narr){ toast('Narration is off. Turn it on in Settings, or read the transcript.'); return; }
  if(!('speechSynthesis' in window)){ toast('Narration is not available on this device. Please read the transcript.'); return; }
  try{ speechSynthesis.cancel(); if(!voice) pickVoice();
    /* speak sentence by sentence: more natural pauses, and avoids Chrome cutting off long text */
    const parts = String(text).replace(/\s+/g,' ').match(/[^.!?:]+[.!?:]*["”']?\s*/g) || [text];
    const rate = (S.settings.rate||1) * (slow?0.72:0.96);
    duck=.25; applyVol();
    parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p.trim()); u.lang = voice? voice.lang : 'en-US'; if(voice) u.voice=voice;
      u.rate=rate; u.pitch=1.04; u.volume=1;
      if(i===parts.length-1) u.onend=u.onerror=()=>{duck=1; applyVol();};
      speechSynthesis.speak(u); });
  }catch(e){ duck=1; applyVol(); toast('Narration could not play. Please read the transcript.'); }
}

function mcHTML(id, opts, cfg){

}

         <tr><td><b>Total</b></td><td>${doneCount()}/7 missions · ${stamps()}/2 stamps</td><td><b>${xp}/600</b></td></tr></tbody></table>
        <div class="grid3" style="margin-top:12px">
         <div class="card"><div class="kicker">Level</div><b>${level(xp)}</b></div>
         <div class="card"><div class="kicker">Quiz (M6)</div>First try ${qf}/6 · After fixing ${qn}/6</div>
         <div class="card"><div class="kicker">Assistance used</div>${S.helps} times (no XP lost)</div></div>
        <div class="card" style="margin-top:12px"><div class="kicker">Your product guide</div><b>${isDone('M6')?'Saved for teacher review':S.m5.saved?'Draft saved · waiting for feedback':'Not written yet'}</b>
         <p class="small">XP shows your learning process. Your teacher assesses the quality of your procedure text with a rubric (goal, order, language, accuracy and safety, test and revision).</p></div>
        <div class="row" style="margin-top:12px"><button class="btn red" data-act="workText">Download / copy my work</button><button class="btn ghost" data-act="go" data-to="map">Replay missions</button><button class="btn ghost" data-act="toCover">Back to cover</button></div>
       </div>${all?`<img class="stampAnim" src="${IMG('16_lencana_selesai.png')}" alt="Quest Completed badge" style="width:210px;flex:none">`:''}</div></div></div>`; },
  after(){ if(doneCount()===7 && !UI.wonShown){ UI.wonShown=true; setTimeout(()=>{ sfx('win'); confetti(); },300); } }
};
function workText(){
  const L=[], m=S, line='----------------------------------------';
  L.push('SATAMART PROCEDURE QUEST — MY WORK','Procedure Text for SataMart Product Marketing',`Date: ${new Date().toLocaleString()}`,line);
  L.push(`XP: ${totalXP()}/600 | Missions: ${doneCount()}/7 | Stamps: ${stamps()}/2 | Level: ${level(totalXP())}`);
  MISSIONS.forEach(x=>L.push(`${x.id} ${x.name}: ${STATUS_TXT[status(x.id)].replace(/^\S+ /,'')} (${missionXP(x.id)}/${x.xp} XP)`));
  L.push(line,'M0 PREDICTION:',m.m0.pred||'-','SELF-CHECK: '+KKTP.map((k,i)=>`C${i+1}=${SELF[m.m0.self[i]]||'-'}`).join(', '));
  L.push(line,'M3 MINI SOP:',...['First,','Next,','Then,','Finally,'].map((w,i)=>m.m3.sop[i]?`${w} ${m.m3.sop[i]}`:'').filter(Boolean),'M3 MK002 explanation: '+(m.m3.mk2.why||'-'));
  L.push(line,'M5 PLANNER:',...PLAN_F.map(([k,l])=>`${l}: ${m.m5.plan[k]||'-'}`));
  L.push(line,'M5 DRAFT:',m.m5.draft||'-');
  L.push(line,'M6 TEST ('+(m.m6.test.who==='friend'?'with a friend':'self-check')+'):',...TEST5.map((x,i)=>`${x} ${m.m6.test.checks[i]===0?'Yes':m.m6.test.checks[i]===1?'Not yet':'-'}`),'Comment: '+(m.m6.test.comment||'-'));
  L.push(line,'M6 REVISED TEXT:',m.m6.after||m.m5.draft||'-','Reason: '+(m.m6.reason||'-'));
  const qf=Object.keys(m.m6.quiz.first).filter(k=>m.m6.quiz.first[k]).length, qn=QUIZ.filter((q,i)=>m.m6.quiz.now[i]).length;
  L.push(line,`M6 QUIZ: first try ${qf}/6, after fixing ${qn}/6`);
  L.push(line,'REFLECTION:','Big question (now): '+(m.m6.refl.pred2||'-'),'What makes instructions useful? '+(m.m6.refl.q1||'-'),'Which step did you improve? '+(m.m6.refl.q2||'-'),'What will you practise next? '+(m.m6.refl.q3||'-'));
  L.push(line,'Status: '+(isDone('M6')?'Saved for teacher review':'In progress'),'The writing is assessed by the teacher with the rubric.');
  return L.join('\n');
}
ACT.workText = () => { closeModal(); const txt=workText();
  modal('My Work', `<p class="small">Submit this to your teacher outside the game (for example, paste it into your class assignment). Nothing is sent online.</p>
   <textarea id="wt" rows="15" readonly style="margin-top:8px;font-size:15px">${esc(txt)}</textarea><div id="wtfb"></div>`,
   {foot:`<button class="btn ghost" data-act="closeModal">Close</button><button class="btn navy" data-act="wtCopy">Copy text</button><button class="btn red" data-act="wtDown">Download .txt</button>`}); };
ACT.wtCopy = () => { const ta=$('#wt'); const done=ok=>{ $('#wtfb').innerHTML=fbHTML(ok?true:null, ok?'Copied. Paste it where your teacher asks.':'Copy is blocked here. The text is selected: press Ctrl+C (or long-press → Copy).'); };
  try{ navigator.clipboard.writeText(ta.value).then(()=>done(true)).catch(()=>{ ta.focus(); ta.select(); done(false); }); }catch(e){ ta.focus(); ta.select(); done(false); } };
ACT.wtDown = () => { try{ const b=new Blob([$('#wt').value],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='SataMart_my_work.txt'; document.body.appendChild(a); a.click(); a.remove();
    $('#wtfb').innerHTML=fbHTML(null,'Download started. If nothing happens, use <b>Copy text</b> instead.'); sfx('save'); }catch(e){ $('#wtfb').innerHTML=fbHTML(false,'Download failed here. Use Copy text.'); } };

/* ================= INIT ================= */
(function init(){ const had=load(); S.cur='cover'; fit(); rerender(); setTimeout(fit,100);
  if(had && S.started) setTimeout(()=>toast('Welcome back! Click <b>Continue</b> to keep your progress.'),600); })();
</script>
